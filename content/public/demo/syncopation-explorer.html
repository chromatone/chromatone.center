<!doctype html>
<html>

<head>
  <meta charset=utf8>
  <meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
  <style>
    :root {
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: #000
    }

    img {
      max-width: 100%
    }

    [hidden]:not([hidden=until-found i]) {
      display: none !important
    }
  </style>
</head>

<body>
  <title>Syncopation Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    /* Layout: one screen. Header transport, grid chips, rhythm chips, then a ruler and four stacked track rectangles with a label column. */
    :root {
      --bg: #121110;
      --panel: #1a1816;
      --panel2: #242120;
      --line: #ffffff17;
      --fg: #ece6dd;
      --dim: #8d857a;
      --play: #fff3dc;
      --c1: oklch(.8 .15 95);
      --c2: oklch(.78 .15 160);
      --tempo: oklch(.8 .15 120);
      --lw: 6rem;
      --disp: 'Unbounded', system-ui, sans-serif;
      --ui: 'Instrument Sans', system-ui, sans-serif;
      --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      height: 100%
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 14px/1.3 var(--ui);
      padding-inline: 16px;
      padding-block: 12px;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent
    }

    button {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 2px solid var(--c1);
      outline-offset: 2px
    }

    #app {
      height: 100%;
      max-width: 1500px;
      margin-inline: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 0
    }

    header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 18px
    }

    h1 {
      margin: 0;
      font: 600 .78rem/1.2 var(--disp);
      letter-spacing: .02em
    }

    .play {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 0;
      background: var(--play);
      color: #14110e;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
      transition: transform .08s
    }

    .play:active {
      transform: scale(.94)
    }

    .play svg {
      grid-area: 1/1;
      width: 20px;
      height: 20px;
      fill: currentColor
    }

    .play[aria-pressed=true] .ip,
    .play[aria-pressed=false] .is {
      display: none
    }

    .bpm {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 8px;
      min-width: 0
    }

    .bpm output {
      font: 600 1.5rem/1 var(--mono);
      min-width: 3ch;
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .bpm small,
    .sub,
    .row>b,
    .rl {
      font: 600 .62rem var(--ui);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim)
    }

    .sq {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      cursor: pointer;
      font: 600 1rem/1 var(--mono);
      color: var(--dim)
    }

    .sq:hover {
      color: var(--fg)
    }

    .bpm output {
      cursor: ew-resize;
      touch-action: none;
      color: var(--tempo);
      padding: 2px 4px;
      border-radius: 6px;
      border-bottom: 1px dashed var(--line)
    }

    .bpm output:hover {
      background: var(--panel)
    }

    .bn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 500 .7rem var(--mono);
      color: var(--dim);
      white-space: nowrap
    }

    .bn i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--tempo);
      box-shadow: 0 0 10px var(--tempo)
    }

    .cwrap {
      display: none;
      position: relative;
      min-height: 0
    }

    .cwrap canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair
    }

    .circ .cwrap {
      display: block;
      grid-column: 2;
      grid-row: 1/-1
    }

    .circ .cell {
      display: none
    }

    .pill {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--dim);
      padding: 6px 12px 6px 10px;
      border-radius: 999px;
      font: 600 .68rem var(--ui);
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px
    }

    .pill::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dim);
      opacity: .5
    }

    .pill[aria-pressed=true] {
      color: var(--fg);
      border-color: #ffffff40;
      background: var(--panel2)
    }

    .pill[aria-pressed=true]::before {
      background: var(--c2);
      opacity: 1
    }

    .tog {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-left: auto
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0
    }

    .row>b {
      width: 4.5rem;
      flex: none
    }

    .chips {
      display: flex;
      gap: 6px;
      min-width: 0;
      flex: 1;
      overflow-x: auto;
      scrollbar-width: none;
      padding-block: 2px;
      overscroll-behavior-x: contain;
      cursor: grab
    }

    .chips::-webkit-scrollbar {
      display: none
    }

    .chips.fl {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px);
      mask-image: linear-gradient(90deg, transparent, #000 32px)
    }

    .chips.fr {
      -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent);
      mask-image: linear-gradient(90deg, #000 calc(100% - 32px), transparent)
    }

    .chips.fl.fr {
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent);
      mask-image: linear-gradient(90deg, transparent, #000 32px, #000 calc(100% - 32px), transparent)
    }

    .fam {
      flex: none;
      align-self: center;
      white-space: nowrap;
      height: 18px;
      line-height: 18px;
      margin-left: 6px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      font: 600 .6rem var(--ui);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--dim)
    }

    .fam:first-child {
      margin: 0;
      padding: 0;
      border: 0
    }

    .g {
      min-width: 2.4rem;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--dim);
      font: 600 .8rem var(--mono);
      cursor: pointer;
      display: inline-flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      flex: none
    }

    .g::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--gc);
      opacity: .45
    }

    .g[aria-pressed=true] {
      color: var(--fg);
      border-color: var(--gc);
      background: color-mix(in srgb, var(--gc) 14%, var(--panel))
    }

    .g[aria-pressed=true]::before {
      opacity: 1
    }

    .p {
      height: 28px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      font: 500 .78rem var(--ui);
      cursor: pointer;
      flex: none
    }

    .p:hover {
      background: var(--panel2)
    }

    .p.on {
      background: var(--fg);
      color: var(--bg);
      border-color: var(--fg)
    }

    .p.clr {
      color: var(--dim)
    }

    #stage {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: var(--lw) minmax(0, 1fr);
      grid-template-rows: 46px repeat(4, minmax(0, 1fr));
      gap: 8px
    }

    .cell {
      position: relative;
      min-height: 0;
      border-radius: 10px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      transition: opacity .15s
    }

    .cell.mut {
      opacity: .4
    }

    .cell.rul {
      background: none;
      border: 0;
      overflow: visible
    }

    .cell canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair
    }

    .lab {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      min-width: 0
    }

    .lab.rl {
      justify-content: flex-end;
      font-family: var(--mono);
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      font-size: .7rem;
      padding-bottom: 2px
    }

    .nm {
      background: none;
      border: 0;
      padding: 0;
      font: 600 1.15rem/1 var(--disp);
      color: var(--c);
      cursor: pointer;
      text-align: left
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px
    }

    .knob {
      width: 30px;
      height: 30px;
      flex: none;
      border-radius: 50%;
      cursor: ns-resize;
      touch-action: none
    }

    .knob svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .knob path,
    .knob line {
      fill: none;
      stroke-linecap: round;
      stroke-width: 2.5
    }

    .knob .kb {
      stroke: #ffffff22
    }

    .knob:hover .kb {
      stroke: #ffffff40
    }

    .knob .kv,
    .knob .kl {
      stroke: var(--c)
    }

    .bt {
      display: flex;
      gap: 5px
    }

    .bt button {
      width: 26px;
      height: 24px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--dim);
      font: 600 .72rem var(--mono);
      cursor: pointer
    }

    .bt button:hover {
      color: var(--fg)
    }

    .bt .m[aria-pressed=true] {
      background: var(--c);
      color: #14110e;
      border-color: var(--c)
    }

    #read {
      font: 500 .74rem var(--mono);
      color: var(--dim);
      min-height: 1.2em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    @media(max-height:640px) {
      .sub {
        display: none
      }
    }

    @media(max-width:640px) {
      :root {
        --lw: 3.2rem
      }

      .nm {
        font-size: .9rem
      }

      .sub {
        display: none
      }

      .knob {
        width: 26px;
        height: 26px
      }

      .row>b {
        display: none
      }

      .tog {
        margin-left: 0
      }

      .pill {
        padding: 5px 9px 5px 8px;
        letter-spacing: .04em;
        gap: 5px
      }

      .bt button {
        width: 22px
      }
    }
  </style>
  <div id="app">
    <header>
      <button class="play" id="play" aria-pressed="false" aria-label="Play or stop (Space)"><svg class="ip"
          viewBox="0 0 20 20">
          <path d="M5 2.5v15l13-7.5z" />
        </svg><svg class="is" viewBox="0 0 20 20">
          <rect x="3.5" y="3.5" width="13" height="13" rx="1.5" />
        </svg></button>
      <h1>Syncopation<br>Explorer</h1>
      <div class="bpm"><button class="sq" id="bm" aria-label="Slower">−</button><output id="bv" role="spinbutton"
          tabindex="0" aria-label="Tempo in BPM"
          title="Drag left or right to change the tempo, one BPM per step">98</output><small>bpm</small><button
          class="sq" id="bp" aria-label="Faster">+</button><span class="bn" id="bn"
          title="The beat rate read as a pitch: 60 bpm is 1 Hz, a C about 38 cents flat. Colour is the Chromatone wheel: A is red and every semitone turns the hue 30°."><i></i><span></span></span>
      </div>
      <div class="tog"><button class="pill" id="clr" title="Remove every hit from all four tracks">Clear</button><button
          class="pill" id="tick" aria-pressed="false"
          title="Click on every line of the selected grids, so you can hear where the grid is">Grid
          ticks</button><button class="pill" id="mag" aria-pressed="true"
          title="Hits snap to nearby grid lines. Hold Alt to place freely">Magnet</button><button class="pill" id="vw"
          aria-pressed="false" title="Show the bar as four inlaid cycles (V)">Circle</button></div>
    </header>
    <div class="row"><b>Grid</b>
      <div class="chips" id="grids"></div>
    </div>
    <div class="row"><b>Rhythms</b>
      <div class="chips" id="pres"></div><button class="sq" id="pv" aria-label="Previous rhythm"
        title="Previous rhythm (←)">‹</button><button class="sq" id="nx" aria-label="Next rhythm"
        title="Next rhythm (→)">›</button>
    </div>
    <main id="stage"></main>
    <div id="read"></div>
  </div>
  <script type="module">
    const $ = (s, r = document) => r.querySelector(s), clamp = (x, a, b) => Math.min(b, Math.max(a, x));
    const css = getComputedStyle(document.documentElement), tok = (n, f) => css.getPropertyValue(n).trim() || f;
    const FG = tok('--fg', '#ece6dd'), DIM = tok('--dim', '#8d857a'), PLAY = tok('--play', '#fff3dc'), MONO = tok('--mono', 'monospace'), PANEL = tok('--panel', '#1a1816'), LINE = tok('--line', '#ffffff17');
    const HINT = 'Space plays · ← → rhythms · V circle · click a track to place a hit, higher is louder · drag to move · click a hit to remove · Alt = free placement';

    /* ---------- state ---------- */
    const GR = Array.from({ length: 16 }, (_, i) => i + 1);
    /* Chromatone colour: A is red and every semitone turns the hue 30 degrees, so 12 semitones close the wheel.
       The wheel is the RGB one (A red, B-C yellow to lime, C# green, E cyan-blue, F blue, G violet, G# magenta),
       laid onto OKLCH hue anchors so every hue has the same lightness and chroma, in P3 where the display has it.
       Any rate in Hz folds into a pitch class: tempo, grid rates and the drum voices all get a colour from it. */
    const HUES = [29, 110, 142, 195, 264, 328, 389];            // OKLCH hue at RGB-wheel angles 0, 60 ... 360
    const semis = f => 12 * Math.log2(f / 440);
    const hueOf = f => { const d = ((30 * semis(f)) % 360 + 360) % 360, i = Math.floor(d / 60); return (HUES[i] + (HUES[i + 1] - HUES[i]) * (d - i * 60) / 60) % 360 };
    const ok = (h, L = .76, C = .16, a = 1) => `oklch(${L} ${C} ${h.toFixed(1)}${a < 1 ? ' / ' + a : ''})`;
    const NOTE = ['A', 'A♯', 'B', 'C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯'];
    const noteOf = f => { const s = semis(f), n = Math.round(s); return { name: NOTE[((n % 12) + 12) % 12] + (Math.floor((69 + n) / 12) - 1), cents: Math.round((s - n) * 100) } };
    const cts = c => (c < 0 ? '−' : '+') + Math.abs(c) + '¢', fmtHz = f => f >= 100 ? f.toFixed(0) : f >= 10 ? f.toFixed(1) : f.toFixed(2);
    const fold = f => { while (f < 330) f *= 2; while (f >= 660) f /= 2; return f };
    const GC = {};                                         // grid colours, rebuilt whenever the tempo changes
    const gHz = n => n * S.bpm / 240;                            // n divisions per bar is a rate of n * bpm / 240 Hz
    const GT = n => fold(gHz(n));                            // grid ticks sound that same pitch class, so 3 against 4 is a fourth you can hear
    const TR = [['bum', 'kick', 55], ['ts', 'shaker', 8800], ['ch', 'snare', 185], ['ka', 'wood', 1000]];   // third value: the voice's own pitch in Hz
    const T = TR.map(([id, sub, f]) => ({ id, sub, f, hue: hueOf(f), col: ok(hueOf(f)), hits: [], muted: false, size: .5, w: 0, h: 0 }));   // size: 0 tight, .5 as designed, 1 loose
    const S = { bpm: 98, grids: new Set([16]), tick: false, mag: true, circ: false, cur: null, playing: false, hp: null };
    const colors = () => GR.forEach(n => GC[n] = ok(hueOf(gHz(n))));
    const barDur = () => 240 / S.bpm;           // one bar = 4 beats; the loop position is a float 0..1
    const lines = () => [...new Set([8, ...S.grids])];

    /* ---------- rhythm library ---------- */
    const V = { X: 1, x: .82, o: .58, g: .34 };
    const str = s => [...s].flatMap((c, i) => V[c] ? [{ p: i / s.length, v: V[c] }] : []);
    const E = (n, o = 0, v = .8, a = v) => Array.from({ length: n }, (_, k) => ({ p: (k + o) / n, v: k ? v : a }));
    /* pc(): hits as "percent-of-bar:velocity", the notation of the research tables.
       Microtiming from measured duration ratios: cumul() turns durations into onset fractions.
       wp(r)        re-times a 16th grid so the four 16ths of each beat follow r
       sub(r,s,n)   r repeats inside each of n equal beats, one char of s per step
       grp(r,s,k)   r cuts the whole bar into unequal pulses, each split in k equal steps (k may be an array)
       Voice order in every preset: bum, ts, ch, ka. */
    const pc = s => s.trim() ? s.trim().split(/\s+/).map(h => { const [a, b] = h.split(':'); return { p: a / 100, v: b / 100 } }) : [];
    const cumul = r => { const t = r.reduce((a, b) => a + b), c = [0]; r.forEach((x, i) => c.push(c[i] + x / t)); return c };
    const wp = r => { const c = cumul(r); return hs => hs.map(h => { const s = Math.round(h.p * 16); return { p: ((s >> 2) + c[s & 3]) / 4, v: h.v } }) };
    const sw = (r, s) => wp(r)(str(s));
    const sub = (r, s, beats = 4) => {
      const n = r.length, c = cumul(r); if (s.length !== beats * n) throw Error('sub ' + s);
      return [...s].flatMap((ch, i) => V[ch] ? [{ p: ((i / n | 0) + c[i % n]) / beats, v: V[ch] }] : [])
    };
    const grp = (r, s, k = 1) => {
      const c = cumul(r), t = r.reduce((a, b) => a + b), st = [];
      r.forEach((x, j) => { const m = Array.isArray(k) ? k[j] : k; for (let q = 0; q < m; q++)st.push(c[j] + x / t * q / m) });
      if (s.length !== st.length) throw Error('grp ' + s); return [...s].flatMap((ch, i) => V[ch] ? [{ p: st[i], v: V[ch] }] : [])
    };
    const FAM = { cu: 'Cuba', br: 'Brazil', ca: 'Latin & Caribbean', af: 'Africa', eu: 'Europe', us: 'Jazz & beats', as: 'Asia & Oceania', x: 'Cycles' };
    const hat8 = 'x.o.x.o.x.o.x.o.';
    const sBum = pc('0:45 25:100 50:45 75:100'),
      sCaixa = pc('0:60 6.25:45 12.5:80 18.75:45 25:60 31.25:45 37.5:80 43.75:45 50:60 56.25:45 62.5:80 68.75:45 75:60 81.25:45 87.5:80 93.75:45'),
      sTam = pc('0:95 18.75:70 37.5:90 50:95 68.75:70 87.5:90'),
      sAg = pc('12.5:70 31.25:55 62.5:70 81.25:55');
    const cumT = [pc('0:95 25:40 50:95 75:40'), pc('0:60 12.5:70 25:60 37.5:70 50:60 62.5:70 75:60 87.5:70'), pc('0:70 25:85 50:70 75:85')],
      canT = [pc('0:95 37.5:90 50:40 87.5:90'), pc('0:85 12.5:85 25:50 37.5:85 50:85 62.5:85 75:50 87.5:85'), pc('0:70 25:90 37.5:60 50:70 75:95 87.5:60')];
    const poly = ['pulse', '8ths', 'cycle A', 'cycle B'];
    /* measured beat splits, percent of the beat (or of the bar for the 3 and 5 pulse cycles) */
    const MEAS = [26, 20.3, 21.3, 32.4], SC = [22, 28, 23, 27], SB = [19, 25, 30, 26], CD = [24, 23, 22, 31],
      ST = [45, 25, 30], MJ = [25, 33, 42], EW = [24, 34, 42], VW = [27, 40, 33], PO = [38, 28, 34], BG = [38, 62], AK = [22, 22, 22, 34],
      JM = [63, 37], JF = [53, 47], DL = [60, 40], WG = [55, 45], HK = [58, 42];
    const PR = [
      {
        f: 'cu', n: 'Tresillo', bpm: 92, g: [16], v: ['bass', 'maraca', 'conga slaps', 'clave'],
        t: [pc('0:100 37.5:80 50:95 87.5:75'), pc('0:50 12.5:75 25:40 37.5:75 50:50 62.5:75 75:40 87.5:75'), pc('12.5:55 43.75:65 62.5:55 93.75:65'), pc('0:85 18.75:60 37.5:80 50:85 68.75:60 87.5:80')]
      },
      {
        f: 'cu', n: 'Son clave 3-2', bpm: 100, g: [16], v: ['bass tumbao', 'cascara', 'conga tumbao', 'clave'],
        t: [pc('18.75:95 43.75:90 68.75:95 93.75:90'), pc('0:60 12.5:40 25:80 37.5:40 50:60 62.5:40 75:80 87.5:40'), pc('6.25:60 25:55 43.75:70 56.25:60 68.75:55 93.75:70'), pc('0:100 18.75:80 37.5:95 62.5:80 75:100')]

        const x = o.p * w, y = yB - (yB - yT) * o.v, r = 5.5 + 3 * o.v, age = now - o.fl, f = age >= 0 && age < .45 ? 1 - age / .45 : 0;
        c.strokeStyle = col; c.lineWidth = 3; c.lineCap = 'round'; c.globalAlpha = .5 + .35 * o.v + .15 * f; ln(c, x, yB, x, y);
        if (f > 0) {
          const g = c.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, col); g.addColorStop(1, ok(t.hue, .76, .16, 0)); c.globalAlpha = .55 * f; c.fillStyle = g; dot(c, x, y, r * 4);
          c.globalAlpha = f * .9; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r + (1 - f) * 16, 0, 6.2832); c.stroke()
        }
        c.globalAlpha = 1; c.fillStyle = col; dot(c, x, y, r); c.globalAlpha = .4; c.fillStyle = '#fff'; dot(c, x - r * .25, y - r * .25, r * .35)
      }
      if (ph != null) { const x = ph * w; c.strokeStyle = PLAY; c.lineCap = 'butt'; c.globalAlpha = .16; c.lineWidth = 7; ln(c, x, 0, x, h); c.globalAlpha = .95; c.lineWidth = 2; ln(c, x, 0, x, h) }
      c.globalAlpha = 1
    }
    function drawCircle(now, ph) {
      const c = C.cx, w = C.w; if (!w) return; c.clearRect(0, 0, w, C.h);
      const G = geo(), { cx, cy, R, r0, bw } = G, P = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)];
      const spoke = (a, ra = r0, rb = R) => ln(c, ...P(ra, a), ...P(rb, a));
      c.lineCap = 'butt'; c.lineWidth = 1;
      for (let k = 0; k < 4; k++) {
        const t = T[RING[k]], m = t.muted ? .45 : 1, a = r0 + k * bw + 2, b = r0 + (k + 1) * bw - 2;      // the four inlaid cycles
        c.globalAlpha = m; c.beginPath(); c.arc(cx, cy, b, 0, TAU); c.moveTo(cx + a, cy); c.arc(cx, cy, a, 0, TAU, true); c.fillStyle = PANEL; c.fill();
        c.strokeStyle = LINE; c.stroke(); c.strokeStyle = '#fff'; c.globalAlpha = .045 * m;
        for (const f of [.25, .5, .75]) { c.beginPath(); c.arc(cx, cy, rad(G, k, f), 0, TAU); c.stroke() }
      }
      c.strokeStyle = '#fff'; for (let k = 0; k < 8; k++) { c.globalAlpha = k % 2 ? .06 : .13; spoke(ang(k / 8)) }
      for (const n of S.grids) { c.strokeStyle = GC[n]; c.globalAlpha = .34; for (let k = 0; k < n; k++)spoke(ang(k / n)) }   // radial grids, one colour per grid
      c.font = '500 11px ' + MONO; c.textAlign = 'center'; c.textBaseline = 'middle';
      for (let k = 0; k < 8; k++) { const [x, y] = P(R + 13, ang(k / 8)); c.globalAlpha = 1; c.fillStyle = k % 2 ? DIM : FG; c.fillText(CNT[k], x, y) }
      c.font = '600 10px ' + MONO; c.textAlign = 'right';
      for (let k = 0; k < 4; k++) { const t = T[RING[k]]; c.globalAlpha = .6; c.fillStyle = t.col; c.fillText(t.id, cx - 6, cy - (r0 + k * bw + bw / 2)) }
      if (r0 > 26) { c.textAlign = 'center'; c.globalAlpha = 1; c.fillStyle = FG; c.font = '600 ' + Math.min(22, r0 * .5) + 'px ' + MONO; c.fillText(S.bpm, cx, cy - 3); c.fillStyle = DIM; c.font = '500 9px ' + MONO; c.fillText('BPM', cx, cy + r0 * .38) }
      c.textAlign = 'left'; c.textBaseline = 'alphabetic';
      if (S.hp != null) { c.globalAlpha = .25; c.strokeStyle = '#fff'; spoke(ang(S.hp)) }
      if (ph != null && c.createConicGradient) {
        const th = ang(ph), sp = .1 * TAU, g = c.createConicGradient(th - sp, cx, cy);   // trailing glow behind the playhead
        g.addColorStop(0, 'rgba(255,243,220,0)'); g.addColorStop(.1, 'rgba(255,243,220,.12)'); g.addColorStop(.1001, 'rgba(255,243,220,0)');
        c.globalAlpha = 1; c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R, th - sp, th); c.arc(cx, cy, r0, th, th - sp, true); c.closePath(); c.fill()
      }
      for (let k = 0; k < 4; k++) {
        const i = RING[k], t = T[i], m = t.muted ? .45 : 1, inner = r0 + k * bw + G.pad;
        c.globalAlpha = .9 * m; c.strokeStyle = t.col; c.lineWidth = 1; c.lineCap = 'butt'; c.beginPath(); c.arc(cx, cy, inner, 0, TAU); c.stroke();   // the ring's baseline
        if (H && H.t === i && !H.over && !D) {
          const a = ang(H.p), [x, y] = P(rad(G, k, H.v), a), [x0, y0] = P(inner, a);
          c.globalAlpha = .4; c.strokeStyle = t.col; c.lineWidth = 3; c.lineCap = 'round'; c.setLineDash([2, 6]); ln(c, x0, y0, x, y); c.setLineDash([]); c.lineWidth = 2; c.beginPath(); c.arc(x, y, 5.5 + 3 * H.v, 0, TAU); c.stroke()
        }
        for (const o of t.hits) {
          const a = ang(o.p), [x, y] = P(rad(G, k, o.v), a), [x0, y0] = P(inner, a), r = 5.5 + 3 * o.v, age = now - o.fl, f = age >= 0 && age < .45 ? 1 - age / .45 : 0;
          c.strokeStyle = t.col; c.lineWidth = 3; c.lineCap = 'round'; c.globalAlpha = (.5 + .35 * o.v + .15 * f) * m; ln(c, x0, y0, x, y);
          if (f > 0) {
            const g = c.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, t.col); g.addColorStop(1, ok(t.hue, .76, .16, 0)); c.globalAlpha = .55 * f * m; c.fillStyle = g; dot(c, x, y, r * 4);
            c.globalAlpha = f * .9 * m; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r + (1 - f) * 16, 0, TAU); c.stroke()
          }
          c.globalAlpha = m; c.fillStyle = t.col; dot(c, x, y, r); c.globalAlpha = .4 * m; c.fillStyle = '#fff'; dot(c, x - r * .25, y - r * .25, r * .35)
        }
      }
      if (ph != null) { const a = ang(ph); c.strokeStyle = PLAY; c.lineCap = 'butt'; c.globalAlpha = .16; c.lineWidth = 7; spoke(a); c.globalAlpha = .95; c.lineWidth = 2; spoke(a) }
      c.globalAlpha = 1
    }
    function frame() {
      const now = ctx ? ctx.currentTime - (ctx.outputLatency || 0) : 0; let ph = null;
      if (S.playing) { ph = cursorPhase - (cursor - now) / barDur(); ph -= Math.floor(ph) }
      if (S.circ) drawCircle(now, ph); else { drawRuler(ph); T.forEach(t => drawTrack(t, now, ph)) }
      requestAnimationFrame(frame)
    }

    /* ---------- go ---------- */
    if (!restore()) load(PR[0]); else setSubs(PR.find(p => p.n === S.cur)?.v);
    rd.textContent = HINT; T.forEach(paintKnob); sync(); ui(); requestAnimationFrame(frame);
  </script>
